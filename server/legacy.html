ont-size:12px;text-align:center}.link-button{background:none;color:var(--purple)}.error{color:#c55060;font-size:12px;min-height:20px}.notice{padding:12px 16px;border-radius:8px;background:#fff7e4;color:#9b7b36;font-size:12px;margin-bottom:22px}.store{max-width:1100px;margin:0 auto;padding:30px 25px}.store-header{text-align:center;padding:30px 0}.store-header h1{margin-top:20px}.checkout-box{padding:25px;max-width:600px;margin:25px auto}.cart-control{display:flex;align-items:center;justify-content:space-between}.cart-control input{width:70px;border:1px solid #dddde9;border-radius:5px;padding:7px}.footer{padding:28px;text-align:center;color:#a0a0b1;font-size:11px}dialog{border:1px solid var(--line);border-radius:15px;width:min(460px,90vw);padding:28px;box-shadow:0 20px 100px #25253d33}dialog::backdrop{background:#24203955}.dialog-top{display:flex;justify-content:space-between;align-items:center}.close{background:none;font-size:25px;color:var(--muted)}.toast{position:fixed;bottom:25px;right:25px;max-width:90vw;padding:14px 22px;border-radius:10px;background:var(--ink);color:white;z-index:9;font-size:13px}.settings{max-width:700px;padding:25px}.settings p{margin:10px 0}.agent-link{max-width:280px;display:block;overflow:hidden;text-overflow:ellipsis}.mobile-logo{display:none}@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}.workspace{padding:25px}.sidebar{width:195px;padding:25px 14px}.main{margin-left:195px;width:calc(100% - 195px)}}@media(max-width:650px){.sidebar{position:static;width:100%;padding:12px;flex-direction:row;flex-wrap:wrap;justify-content:center;border-bottom:1px solid var(--line);gap:4px}.sidebar .logo{width:100%;justify-content:center;margin:7px 0 12px}.caption,.sidebar-bottom{display:none}.nav{width:auto;padding:8px 12px;margin:0;font-size:12px;gap:5px}.nav b{display:none}.layout{display:block}.main{margin:0;width:100%}header{height:60px;padding:0 20px}.workspace{padding:22px 16px}.top{align-items:flex-start;flex-wrap:wrap}h1{font-size:23px}.metrics{gap:10px}.metric{padding:15px}.metric-value{font-size:23px}.product-grid{grid-template-columns:1fr}.auth{grid-template-columns:1fr}.auth-story{padding:35px}.auth-story h1{font-size:30px;margin:15px 0}.auth-story p{font-size:13px}.auth-form{padding:30px}.card-title{padding:18px}.profile .email{display:none}.chart{gap:5px;margin-left:15px;margin-right:15px}}
.logo{gap:0;font-style:italic;font-weight:900;color:#101933;letter-spacing:-1.4px}.logo i{background:linear-gradient(135deg,#009ef5,#075ce5 55%,#b52bf0)}.logo .brand-ez{background:linear-gradient(120deg,#009ef5,#075ce5);background-clip:text;-webkit-background-clip:text;color:transparent}.logo .brand-shop{color:#101933}.logo img{width:140px;height:84px;object-fit:contain;max-width:100%}.auth-story .logo img{width:215px;height:145px}.sidebar .logo:has(img){min-height:85px}.btn:not(.secondary){background:linear-gradient(110deg,#075ce5,#643be7)}.tag.cancelled{background:#efeff4;color:#79798e}.order-info{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}.order-info p{overflow-wrap:anywhere;color:#51576c;font-size:13px}.order-info small{display:block;color:var(--muted);margin-bottom:4px}.order-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.danger{color:#ba4556!important;border-color:#e9b8bf!important}dialog:has(.order-info){width:min(680px,94vw)}.order-total{text-align:right;font-weight:700;margin-top:18px}.order-reference{color:var(--purple)}@media(max-width:650px){.order-info{grid-template-columns:1fr}.logo img{height:62px}.order-actions{flex-wrap:wrap}}
</style></head><body><main id="app"><div class="empty">正在加载 EzShop…</div></main><dialog id="modal"></dialog><div id="toast" class="toast" hidden role="status"></div><script>
const $=s=>document.querySelector(s), app=$('#app');let state=null,tab='dashboard',authMode='login',store=null,cart={},brandLogo=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'RM '+(n/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
function logo(){return brandLogo?'<div class="logo"><img src="/brand/logo.png" alt="EZShop"></div>':'<div class="logo" aria-label="EZShop"><span class="brand-ez">EZ</span><span class="brand-shop">Shop</span></div>'}
const statusLabel=s=>({paid:'已付款',pending:'待付款',cancelled:'已取消'}[s]||s);
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4500)}
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
function storeURL(code=''){return '/shop?slug='+encodeURIComponent(state.merchant.slug)+(code?'&agent='+encodeURIComponent(code):'')}
async function boot(){try{brandLogo=(await api('brand')).logo}catch{}if(location.pathname==='/shop')return loadStore();try{state=await api('dashboard');render()}catch(e){auth()}}
function auth(){app.innerHTML=`<div class="auth"><section class="auth-story">${logo()}<h1>让生意更简单，<br>让每一笔订单<br>井井有条。</h1><p>为马来西亚商家打造的订单管理工作台。<br>从线上开店到代理佣金，一个地方轻松管理。</p></section><section class="auth-form"><div class="form-wrap"><small style="color:var(--purple)">YOUR BUSINESS, SIMPLIFIED</small><h1>${authMode==='login'?'欢迎回来 👋':'开始你的 EzShop 生意'}</h1><p>${authMode==='login'?'登录并查看你的商家工作台':'创建店铺，开始接收第一笔订单'}</p><form id="authForm">${authMode==='register'?'<label class="field">店铺名称<input name="name" required maxlength="80" placeholder="例如：Kedai Kita"></label><label class="field">店铺网址标识<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="60" placeholder="kedai-kita"></label>':''}<label class="field">邮箱地址<input type="email" name="email" required autocomplete="username" placeholder="you@company.com"></label><label class="field">密码<input type="password" name="password" required minlength="${authMode==='register'?10:1}" maxlength="256" autocomplete="${authMode==='register'?'new-password':'current-password'}" placeholder="${authMode==='register'?'至少 10 个字符':'输入你的密码'}"></label><div class="error" id="authError" role="alert"></div><button class="btn" type="submit">${authMode==='login'?'登录工作台 →':'创建店铺 →'}</button></form><div class="auth-switch">${authMode==='login'?'还没有商家账号？':'已有账号？'}<button class="link-button" id="switchAuth">${authMode==='login'?'免费注册':'登录'}</button></div><div class="footer">本地开发原型 · 暂未接入线上支付</div></div></section></div>`;$('#switchAuth').onclick=()=>{authMode=authMode==='login'?'register':'login';auth()};$('#authForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api(authMode,Object.fromEntries(new FormData(e.target)));await boot()}catch(x){$('#authError').textContent=x.message}finally{b.disabled=false}}}
const navs=[['dashboard','◫','总览'],['orders','▤','订单管理'],['products','▣','商品管理'],['agents','♧','代理与佣金'],['settings','⚙','店铺设置']];
function render(){const m=state.merchant;app.innerHTML=`<div class="layout"><aside class="sidebar">${logo()}<div class="caption">商家工作台</div>${navs.map(([id,icon,label])=>`<button class="nav ${tab===id?'active':''}" data-tab="${id}"><b>${icon}</b>${label}</button>`).join('')}<div class="sidebar-bottom"><div class="hint"><strong>你的生意，你的节奏。</strong>分享店铺链接，让顾客随时下单。</div><button class="nav" id="logout" style="margin-top:15px"><b>↪</b>退出登录</button></div></aside><section class="main"><header><div class="breadcrumb">工作台 &nbsp; / &nbsp; ${navs.find(n=>n[0]===tab)[2]}</div><div class="profile"><span class="email">${esc(m.name)}</span><div class="avatar">${esc(m.name.slice(0,1).toUpperCase())}</div></div></header><div class="workspace" id="content"></div><div class="footer">© ${new Date().getFullYear()} EzShop · Made for Malaysian businesses</div></section></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#logout').onclick=async()=>{try{await api('logout',{});state=null;auth()}catch(e){toast(e.message)}};({dashboard,orders,products,agents,settings}[tab])()}
function title(h,p,action=''){return `<div class="top"><div><h1>${h}</h1><p>${p}</p></div>${action}</div>`}
function orderTable(rows){return `<div class="table-scroll"><table><thead><tr><th>订单编号</th><th>顾客</th><th>日期（UTC）</th><th>金额</th><th>付款状态</th><th>操作</th></tr></thead><tbody>${rows.map(o=>`<tr><td style="color:var(--purple);font-weight:600">${esc(o.reference)}</td><td>${esc(o.customer)}<br><small style="color:var(--muted)">${esc(o.email)}</small></td><td>${esc(o.created)}</td><td>${money(o.total)}</td><td><span class="tag ${esc(o.status)}">${statusLabel(o.status)}</span></td><td><button class="btn secondary small" data-detail="${o.id}">详情</button> ${o.status==='pending'?`<button class="btn secondary small" data-pay="${o.id}">确认收款</button>`:'—'}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">还没有订单。添加商品后，分享店铺链接即可接单。</div>'}</div>`}
function bindPayments(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>orderDetail(Number(b.dataset.detail)));document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.pay);const o=state.orders.find(o=>o.id===id);const d=$('#modal');d.innerHTML=`<div class="dialog-top"><h2>确认已收到付款？</h2><button class="close" aria-label="关闭">×</button></div><p style="margin:18px 0">订单 ${esc(o.reference)} · ${money(o.total)}<br>请先核对实际到账记录。此操作会计入销售额及代理佣金。</p><div class="error" role="alert"></div><button class="btn" id="confirmPay">已核实，确认收款</button>`;d.querySelector('.close').onclick=()=>d.close();$('#confirmPay').onclick=async e=>{e.target.disabled=true;try{await api('orders/paid',{id});d.close();await refresh();toast('已确认收款')}catch(x){d.querySelector('.error').textContent=x.message;e.target.disabled=false}};d.showModal()})}
async function orderDetail(id){try{const result=await api('orders/detail?id='+id),o=result.order,d=$('#modal');d.innerHTML=`<div class="dialog-top"><h2>订单详情</h2><button class="close" aria-label="关闭">×</button></div><p class="order-reference">${esc(o.reference)} · ${statusLabel(o.status)}</p><div class="order-info"><p><small>顾客姓名</small>${esc(o.customer)}</p><p><small>联系方式</small>${esc(o.phone)}<br>${esc(o.email)}</p><p><small>收货地址</small>${esc(o.address)}</p><p><small>代理 / 佣金</small>${esc(o.agent_name||'无代理')} / ${money(o.commission)}</p></div><div class="table-scroll"><table><thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr></thead><tbody>${result.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${money(i.price)}</td><td>${i.quantity}</td><td>${money(i.price*i.quantity)}</td></tr>`).join('')}</tbody></table></div><p class="order-total">合计 ${money(o.total)}</p><div class="error" role="alert"></div>${o.status==='pending'?'<div class="order-actions"><button class="btn secondary danger" id="cancelOrder">取消订单并恢复库存</button></div>':''}`;d.querySelector('.close').onclick=()=>d.close();if($('#cancelOrder'))$('#cancelOrder').onclick=()=>{d.innerHTML=`<div class="dialog-top"><h2>确认取消订单？</h2><button class="close" aria-label="关闭">×</button></div><p style="margin:20px 0">${esc(o.reference)} · ${money(o.total)}<br>取消后商品会恢复库存，订单不再允许确认收款。</p><div class="error" role="alert"></div><div class="order-actions"><button class="btn secondary" id="backToOrder">返回详情</button><button class="btn" id="confirmCancel">确认取消</button></div>`;d.querySelector('.close').onclick=()=>d.close();$('#backToOrder').onclick=()=>orderDetail(id);$('#confirmCancel').onclick=async e=>{e.target.disabled=true;try{await api('orders/cancel',{id});d.close();await refresh();toast('订单已取消，库存已恢复')}catch(x){d.querySelector('.error').textContent=x.message;e.target.disabled=false}}};if(!d.open)d.showModal()}catch(e){toast(e.message)}}
async function refresh(){state=await api('dashboard');render()}
function dashboard(){const paid=state.orders.filter(o=>o.status==='paid'),pending=state.orders.filter(o=>o.status==='pending'),revenue=paid.reduce((s,o)=>s+o.total,0),commission=paid.reduce((s,o)=>s+o.commission,0);const metrics=[['总销售额',money(revenue),'仅统计已确认付款订单','↗'],['订单总数',state.orders.length,'所有顾客提交的订单','▤'],['待收款金额',money(pending.reduce((s,o)=>s+o.total,0)),pending.length+' 笔订单等待付款','◷'],['代理佣金',money(commission),'已付款订单产生的佣金','♧']];const days=Array.from({length:7},(_,i)=>{let d=new Date();d.setUTCDate(d.getUTCDate()-6+i);let key=d.toISOString().slice(0,10);return {label:key.slice(5),v:paid.filter(o=>o.created.startsWith(key)).reduce((s,o)=>s+o.total,0)}}),max=Math.max(1,...days.map(d=>d.v));$('#content').innerHTML=title('生意总览','每一笔订单，都是生意的新进展。',`<a class="btn secondary" href="${storeURL()}" target="_blank" rel="noopener">↗ 查看我的店铺</a>`)+`<div class="metrics">${metrics.map(([l,v,n,i])=>`<div class="card metric"><div class="metric-top"><span>${l}</span><span class="metric-icon">${i}</span></div><div class="metric-value">${v}</div><div class="metric-note">${n}</div></div>`).join('')}</div><div class="split"><section class="card"><div class="card-title"><h2>销售趋势</h2><small style="color:var(--muted)">最近 7 天 · UTC</small></div><div class="chart">${days.map(d=>`<div class="chart-column"><div class="bar" style="height:${Math.round(d.v/max*145)}px" title="${money(d.v)}"></div><span class="chart-label">${d.label}</span></div>`).join('')}</div></section><section class="card"><div class="card-title"><h2>快捷操作</h2><span style="color:var(--muted)">✧</span></div><div class="quick"><div class="quick-item"><b>＋</b><div><strong>添加新商品</strong><p>让顾客发现你的好产品</p></div><button aria-label="添加商品" id="quickProduct">→</button></div><div class="quick-item"><b>↗</b><div><strong>分享店铺</strong><p>复制链接，开始接收订单</p></div><button aria-label="分享店铺" id="share">→</button></div><div class="quick-item"><b>♧</b><div><strong>邀请销售代理</strong><p>让合作伙伴帮你拓展生意</p></div><button aria-label="添加代理" id="quickAgent">→</button></div></div></section></div><section class="card"><div class="card-title"><h2>最近订单</h2><button class="link-button" id="allOrders">查看全部 →</button></div>${orderTable(state.orders.slice(0,5))}</section>`;$('#quickProduct').onclick=()=>productDialog();$('#quickAgent').onclick=agentDialog;$('#share').onclick=()=>copyLink(location.origin+storeURL());$('#allOrders').onclick=()=>{tab='orders';render()};bindPayments()}
function orders(){const q=state.orders;$('#content').innerHTML=title('订单管理','查看顾客订单，并在核实到账后确认收款。')+`<div class="notice">付款确认目前由商家手动操作。线上支付、自动收据及提醒尚未接入。</div><section class="card"><div class="card-title"><h2>全部订单 · ${q.length}</h2><select id="filter" aria-label="筛选订单"><option value="all">所有状态</option><option value="pending">待付款</option><option value="paid">已付款</option><option value="cancelled">已取消</option></select></div><div id="orderRows">${orderTable(q)}</div></section>`;$('#filter').onchange=e=>{$('#orderRows').innerHTML=orderTable(q.filter(o=>e.target.value==='all'||o.status===e.target.value));bindPayments()};bindPayments()}
function products(){$('#content').innerHTML=title('商品管理','管理店铺商品、价格与可售库存。','<button class="btn" id="addProduct">＋ 添加商品</button>')+(state.products.length?`<div class="product-grid">${state.products.map(p=>`<article class="card"><div class="product-art">${esc(p.emoji)}</div><div class="product-body"><strong>${esc(p.name)}</strong><div class="price">${money(p.price)}</div><div class="stock">库存 ${p.stock} 件</div><button class="btn secondary small" style="margin-top:15px" data-edit-product="${p.id}">编辑商品</button></div></article>`).join('')}</div>`:'<div class="card empty">你的商品故事，从这里开始。点击「添加商品」建立第一件商品。</div>');$('#addProduct').onclick=()=>productDialog();document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>productDialog(state.products.find(p=>p.id===Number(b.dataset.editProduct))))}
function formDialog(title,fields,endpoint,transform){const d=$('#modal');d.innerHTML=`<div class="dialog-top"><h2>${title}</h2><button class="close" aria-label="关闭">×</button></div><form>${fields}<div class="error" role="alert"></div><button class="btn" type="submit">保存</button></form>`;d.querySelector('.close').onclick=()=>d.close();d.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api(endpoint,transform(Object.fromEntries(new FormData(e.target))));d.close();await refresh();toast('保存成功')}catch(x){d.querySelector('.error').textContent=x.message}finally{b.disabled=false}};d.showModal()}
function productDialog(product=null){const editing=!!product;formDialog(editing?'编辑商品':'添加商品',`<label class="field">商品名称<input name="name" required maxlength="120" placeholder="例如：手工曲奇礼盒" value="${esc(product?.name||'')}"></label><label class="field">价格（MYR）<input type="number" name="price" min="0.01" max="1000000" step="0.01" required placeholder="39.90" value="${product?(product.price/100).toFixed(2):''}"></label><label class="field">可售库存数量<input type="number" name="stock" min="0" max="1000000" step="1" required value="${product?.stock??10}"></label><label class="field">商品图标<select name="emoji">${['📦','🍪','☕','👕','🎁','🧴','🍰'].map(e=>`<option ${e===product?.emoji?'selected':''}>${e}</option>`).join('')}</select></label>${editing?'<p style="font-size:12px">修改价格只影响新订单，已有订单保留成交价格。库存为尚未被订单预留的数量。</p>':''}`,editing?'products/update':'products',f=>({...f,price:Math.round(Number(f.price)*100),stock:Number(f.stock),...(editing?{id:product.id,version:product.version}:{})}))}
function agentDialog(){formDialog('添加销售代理','<label class="field">代理名称<input name="name" required maxlength="80" placeholder="代理姓名"></label><label class="field">佣金比例（%）<input type="number" name="rate" min="0" max="100" step="1" value="10" required></label>','agents',f=>({...f,rate:Number(f.rate)}))}
async function copyLink(link){try{await navigator.clipboard.writeText(link);toast('链接已复制')}catch{toast('请复制此链接：'+link)}}
function agents(){$('#content').innerHTML=title('代理与佣金','通过专属店铺链接归属订单，收款后累计佣金。','<button class="btn" id="addAgent">＋ 添加代理</button>')+`<div class="notice">此版本支持代理链接归属及佣金统计；代理独立登录、提现与佣金结算尚未开放。</div><section class="card"><div class="table-scroll"><table><thead><tr><th>代理名称</th><th>佣金比例</th><th>订单数</th><th>已赚佣金</th><th>专属店铺链接</th></tr></thead><tbody>${state.agents.map(a=>`<tr><td>${esc(a.name)}</td><td>${a.rate}%</td><td>${a.orders_count}</td><td>${money(a.earned)}</td><td><a class="agent-link" href="${storeURL(a.code)}" target="_blank" rel="noopener">${esc(location.origin+storeURL(a.code))}</a></td></tr>`).join('')}</tbody></table>${state.agents.length?'':'<div class="empty">添加第一位代理，生成专属销售链接。</div>'}</div></section>`;$('#addAgent').onclick=agentDialog}
function settings(){const m=state.merchant;$('#content').innerHTML=title('店铺设置','更新顾客看到的店铺信息，保留现有店铺链接。')+`<section class="card settings"><form id="settingsForm"><label class="field">店铺名称<input name="name" required maxlength="80" value="${esc(m.name)}"></label><label class="field">店铺简介<textarea name="description" maxlength="500" rows="4" placeholder="向顾客介绍你的店铺">${esc(m.description)}</textarea></label><label class="field">公开 WhatsApp 联系电话<input name="phone" type="tel" maxlength="16" pattern="[+]?[0-9]{8,15}" value="${esc(m.phone)}" placeholder="+60123456789"></label><p style="font-size:12px">电话与简介会显示在公开店铺页面，请填写商用联系资料。</p><p>登录邮箱：${esc(m.email)}</p><p>交易币种：MYR · 马来西亚令吉</p><p>店铺网址：<a href="${storeURL()}" target="_blank" rel="noopener">${esc(location.origin+storeURL())}</a></p><div class="error" role="alert"></div><button class="btn" type="submit">保存店铺资料</button></form><div class="notice" style="margin-top:22px">当前通过联系商家付款并手动确认到账；线上支付、自动邮件及订阅收费尚未开放。</div><button class="btn secondary" id="settingsLogout">退出登录</button></section>`;$('#settingsLogout').onclick=()=>$('#logout').click();$('#settingsForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api('settings',Object.fromEntries(new FormData(e.target)));await refresh();toast('店铺资料已保存')}catch(x){e.target.querySelector('.error').textContent=x.message;b.disabled=false}}}
async function loadStore(){try{const params=new URLSearchParams(location.search);store=await api('store?slug='+encodeURIComponent(params.get('slug')||''));app.innerHTML=`<div class="store">${logo()}<div class="store-header"><small style="color:var(--purple);letter-spacing:2px">WELCOME TO OUR STORE</small><h1>${esc(store.store.name)}</h1><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(store.store.description||'选好心仪商品，轻松提交订单。')}</p>${store.store.phone?`<a class="btn secondary small" style="margin-top:15px" href="https://wa.me/${encodeURIComponent(store.store.phone.replace(/[^0-9]/g,''))}" target="_blank" rel="noopener">WhatsApp 联系商家</a>`:''}</div><div class="notice">本店当前通过联系商家完成付款。提交订单不会自动扣款，暂不支持在线支付。</div><div class="product-grid">${store.products.map(p=>`<article class="card"><div class="product-art">${esc(p.emoji)}</div><div class="product-body"><strong>${esc(p.name)}</strong><div class="price">${money(p.price)}</div><label class="cart-control"><span class="stock">${p.stock?'可售 '+p.stock+' 件':'暂时售罄'}</span><input aria-label="${esc(p.name)} 数量" data-quantity="${p.id}" type="number" min="0" max="${Math.min(1000,p.stock)}" step="1" value="0" ${p.stock?'':'disabled'}></label></div></article>`).join('')}</div>${store.products.length?`<section class="card checkout-box"><h2>填写收货资料</h2><form id="checkout"><label class="field">姓名<input name="customer" required maxlength="100" autocomplete="name"></label><label class="field">邮箱<input name="email" type="email" required maxlength="200" autocomplete="email"></label><label class="field">手机号码<input name="phone" type="tel" required maxlength="40" autocomplete="tel"></label><label class="field">收货地址<textarea name="address" required maxlength="500" autocomplete="street-address"></textarea></label><div style="display:flex;justify-content:space-between;margin:20px 0"><strong>订单总额</strong><strong class="price" id="cartTotal">RM 0.00</strong></div><div class="error" id="checkoutError" role="alert"></div><button class="btn" style="width:100%" type="submit">提交订单 →</button></form></section>`:'<div class="card empty">商家正在准备商品，请稍后再来。</div>'}<div class="footer">Powered by EzShop · 线上订购，轻松经营</div></div>`;document.querySelectorAll('[data-quantity]').forEach(i=>i.oninput=()=>{cart[i.dataset.quantity]=Number(i.value);$('#cartTotal').textContent=money(store.products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0))});if($('#checkout'))$('#checkout').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const result=await api('checkout',{...Object.fromEntries(new FormData(e.target)),slug:store.store.slug,agent:params.get('agent')||'',items:Object.entries(cart).filter(([id,q])=>q>0).map(([id,q])=>({id:Number(id),quantity:q}))});app.innerHTML=`<div class="store"><div class="card checkout-box" style="text-align:center;margin-top:80px"><div style="font-size:50px">✓</div><h1>订单提交成功</h1><p style="margin:20px">订单编号：${esc(result.reference)}<br>订单总额：${money(result.total)}</p><div class="notice">${esc(result.message)}</div><a class="btn" href="${esc(location.pathname+location.search)}">返回店铺</a></div></div>`}catch(x){$('#checkoutError').textContent=x.message;b.disabled=false}}}catch(e){app.innerHTML=`<div class="empty"><h1>店铺暂时无法打开</h1><p>${esc(e.message)}</p></div>`}}
boot();
</script></body></html>
