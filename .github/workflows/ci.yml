name: EZShop · 构建与测试
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - name: TypeScript 与构建
        run: npm run build
      - name: 购物车及 PostgreSQL 权限测试
        run: npm test
      - name: 本地后端集成测试
        run: npm run test:api
      - name: 浏览器依赖
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: 商家与顾客端完整流程
        run: python tests/browser.py
      - name: 隔离构建验证邮件界面
        env:
          VITE_SUPABASE_URL: https://auth-test.supabase.co
          VITE_SUPABASE_ANON_KEY: browser-test-public-key
        run: npm run build -- --outDir=auth-test-dist
      - name: 验证邮件回跳（所有远端请求均拦截）
        env:
          EZSHOP_AUTH_TEST_DIST: auth-test-dist
        run: python tests/auth_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ezshop-validation
          path: |
            dist/
            test-results/
          if-no-files-found: ignore
