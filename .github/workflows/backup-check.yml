name: EZShop · 只读备份检查
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/backup-check.yml
      - scripts/check-backups.mjs
      - scripts/backup-status-lib.mjs
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 读取数据库备份记录，不创建或恢复备份
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-backups.mjs
