name: EZShop · 手动发布网站
on:
  workflow_call:
    inputs:
      confirm:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      confirm:
        description: "确认已配置 Supabase、应用并验证迁移，输入 DEPLOY 才发布"
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 正式验收未齐全时不发布
        run: node scripts/check-final-acceptance.mjs
      - name: 检查公开项目配置
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo '请先在仓库 Variables 配置 VITE_SUPABASE_URL'; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo '请先配置 Supabase anon / publishable key，严禁 service_role'; exit 1; }
          node scripts/check-public-config.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: 核对正式后端地区及币种能力
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run check:live -- --database-only
      - name: 构建 GitHub Pages 网站
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_CONNECT_ENABLED: ${{ vars.VITE_STRIPE_CONNECT_ENABLED }}
          VITE_STRIPE_AUTOMATION_ENABLED: ${{ vars.VITE_STRIPE_AUTOMATION_ENABLED }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          EZSHOP_CUSTOM_DOMAIN: ${{ vars.EZSHOP_CUSTOM_DOMAIN }}
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布并输出网址
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 确认网站实际版本已更新
        env:
          DEPLOYED_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/check-site-release.mjs
      - name: 新域名登录回跳配置及回读验证
        if: vars.EZSHOP_CUSTOM_DOMAIN == 'ezshop.lifestyle'
        env:
          EZSHOP_CUSTOM_DOMAIN: ${{ vars.EZSHOP_CUSTOM_DOMAIN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/configure-domain-auth.mjs
