name: EZShop · 一次更新网站与后端
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 输入DEPLOY更新已有数据库项目的后端函数及网站；不执行数据库迁移，不创建付款
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ezshop-complete-release
  cancel-in-progress: false
jobs:
  acceptance:
    if: inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 全部正式验收完成后才发布
        run: node scripts/check-final-acceptance.mjs
  backend:
    needs: acceptance
    if: inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend.yml
    with:
      action: deploy-functions
      confirm: DEPLOY_FUNCTIONS
    secrets: inherit
  website:
    needs: backend
    uses: ./.github/workflows/pages.yml
    with:
      confirm: DEPLOY
    secrets: inherit
