name: EZShop · 一次更新网站与后端
on:
  workflow_call:
    inputs:
      confirm:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      confirm:
        description: 输入DEPLOY按用户当前发布授权升级后端和网站；不创建付款
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ezshop-complete-release
  cancel-in-progress: false
jobs:
  acceptance:
    if: inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 检查用户当前发布条件
        run: node scripts/check-final-acceptance.mjs
  backend:
    needs: acceptance
    if: inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend.yml
    with:
      action: upgrade-and-deploy
      confirm: UPGRADE_AND_DEPLOY
    secrets: inherit
  website:
    needs: backend
    uses: ./.github/workflows/pages.yml
    with:
      confirm: DEPLOY
    secrets: inherit
